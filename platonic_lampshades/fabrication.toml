# Fabrication values and check settings for platonic_lampshades.
# Geometry values live in the SolidCraft designs. A string value names a parameter of `design`
# (read with fabrication/tools/scparams.py); a number is a fixed value in mm.
# Read by fabrication/tools/dxf_check.py, param_sync.py and release.py.

design = "cad/dodecahedron/dodecahedron_kit.sc"
bom = "docs/overview.md"            # BOM table: names the laser files and their counts

[sheet]
material = "birch plywood, laser grade"
thickness = "t"                     # nominal, mm
# measured_thickness = 3.05         # mm: measure the sheet before the order (release.py requires it)
provider = ""                       # cutcraft | formulor: choose before the order (release.py requires it)
size = [1200, 600]                  # mm: laser_cutting.md default; the provider file overrides it
margin = 5.0                        # mm: margin to the sheet edge

[dxf]
folders = ["cad/dodecahedron"]
kerf = "kerf"                       # the DXFs are kerf-compensated: cut web = drawn web - kerf
web_min = "t"                       # laser_cutting.md: narrow web >= material thickness
hole_min = 1.5                      # mm: narrowest hole (inscribed circle diameter after the cut)
part_min = 20.0                     # mm: smaller parts can fall through the table (warning)
part_gap = 2.0                      # mm: gap between parts in one file (warning)
allow_islands = []                  # files in which a loop inside a hole is intended
# Each laser file is checked for staleness against these sources (warning when older).
[dxf.sources]
"panel_x1.dxf" = ["cad/dodecahedron/dodecahedron_kit.sc"]
"key_x50.dxf" = ["cad/dodecahedron/dodecahedron_kit.sc"]
"lug_key_x10.dxf" = ["cad/dodecahedron/dodecahedron_kit.sc"]
"top_plate_x1.dxf" = ["cad/dodecahedron/dodecahedron_kit.sc"]
"upper_panel_x5.dxf" = ["cad/dodecahedron/panel_x1.dxf", "tools/panel_pattern.py", "cad/dodecahedron/dodecahedron_kit.sc"]
"lower_panel_x5.dxf" = ["cad/dodecahedron/panel_x1.dxf", "tools/panel_pattern.py", "cad/dodecahedron/dodecahedron_kit.sc"]
"joint_test_x1.dxf" = ["tools/joint_keys.py", "cad/dodecahedron/joint_test.sc", "cad/dodecahedron/dodecahedron_kit.sc"]

[params]
# Same-named parameters of these designs must agree, except the names in allow_differ.
designs = ["cad/dodecahedron/dodecahedron_kit.sc", "cad/dodecahedron/joint_test.sc"]
allow_differ = ["ek"]               # joint_test.sc: 30 mm key spacing on the 60 mm test plates
# Parameter tables in the docs: rows "| `name` | value unit | ..." must match the design.
docs = [
  { file = "docs/overview.md", design = "cad/dodecahedron/dodecahedron_kit.sc" },
  { file = "docs/joinery.md", design = "cad/dodecahedron/dodecahedron_kit.sc" },
]
